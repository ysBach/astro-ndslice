name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/artifacts.yml
    with:
      release: ${{ inputs.release || false }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --python 3.13
      - run: uv run --no-sync isort --check-only astro_ndslice .github/scripts .github/tests
      - run: uv run --no-sync ruff format --check astro_ndslice .github/scripts .github/tests
      - run: uv run --no-sync ruff check astro_ndslice .github/scripts .github/tests
      - run: uv run --no-sync pytest --doctest-modules astro_ndslice -q
